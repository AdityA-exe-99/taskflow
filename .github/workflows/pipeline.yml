# TaskFlow pipeline (v2)
# Pull requests: run unit + integration tests on the CI VM
# Merge to main: tests -> build + push image to GHCR -> deploy to production with health check and rollback
name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/aditya-exe-99/taskflow

jobs:
  # kept the name "check" because branch protection requires it
  check:
    runs-on: [self-hosted, ci-build]
    steps:
      - uses: actions/checkout@v4

      # the test image builds on top of the normal app image
      - name: Build test base image
        run: docker build -t taskflow-test-runtime:local .

      - name: Run unit and integration tests (80% coverage gate)
        env:
          TASKFLOW_TEST_REPORTS: ./test-results/latest
        run: |
          mkdir -p test-results/latest
          chmod 777 test-results/latest
          docker compose -p ci-${{ github.run_id }} -f docker-compose.test.yml up --build --exit-code-from tests

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: test-results/latest/

      # containers write reports as a different user, so clean them up with docker
      - name: Clean up
        if: always()
        run: |
          docker compose -p ci-${{ github.run_id }} -f docker-compose.test.yml down -v
          docker run --rm -v "$PWD/test-results:/r" busybox rm -rf /r/latest

  build:
    needs: check
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, ci-build]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        run: docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:main .

      - name: Push image
        run: |
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:main

      - name: Summary
        run: echo "Pushed \`$IMAGE:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Tidy old images
        if: always()
        run: docker image prune -f

  deploy-prod:
    needs: build
    runs-on: [self-hosted, ci-build]
    env:
      HOST: ${{ secrets.PROD_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          echo "${{ secrets.PROD_SSH_KEY }}" > "$RUNNER_TEMP/deploy_key"
          chmod 600 "$RUNNER_TEMP/deploy_key"
          echo "SSH_OPTS=-i $RUNNER_TEMP/deploy_key -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"

      - name: Copy compose file and deploy script
        run: scp $SSH_OPTS deploy/docker-compose.yml deploy/deploy.sh deploy@$HOST:/opt/aerodeploy/

      # secrets go over stdin, so they never appear in logs or on the command line
      - name: Send secrets to the server
        env:
          DB_PW: ${{ secrets.PROD_DB_PASSWORD }}
          APP_SECRET: ${{ secrets.SECRET_KEY }}
        run: |
          printf 'IMAGE_TAG=%s\nPOSTGRES_PASSWORD=%s\nSECRET_KEY=%s\n' "${{ github.sha }}" "$DB_PW" "$APP_SECRET" \
            | ssh $SSH_OPTS deploy@$HOST 'umask 077; cat > /opt/aerodeploy/.env.new'

      - name: Log in to GHCR on the server
        run: echo "${{ secrets.GITHUB_TOKEN }}" | ssh $SSH_OPTS deploy@$HOST "docker login ghcr.io -u ${{ github.actor }} --password-stdin"

      - name: Deploy, health check, roll back on failure
        run: ssh $SSH_OPTS deploy@$HOST "bash /opt/aerodeploy/deploy.sh ${{ github.sha }}"

      - name: Check the live site through Nginx
        continue-on-error: true
        run: curl -fsS "http://$HOST/health"

      - name: Summary
        run: echo "Deployed \`$IMAGE:${{ github.sha }}\` to production (http://$HOST)" >> $GITHUB_STEP_SUMMARY

      - name: Clean up
        if: always()
        run: |
          ssh $SSH_OPTS deploy@$HOST "docker logout ghcr.io" || true
          rm -f "$RUNNER_TEMP/deploy_key"
