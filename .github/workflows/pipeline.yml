# TaskFlow pipeline (v3)
# Pull requests: run unit + integration tests on the CI VM
# Merge to main: tests -> build + push image to GHCR -> staging (when enabled) -> production
# Each deploy backs up the DB, checks /health and rolls back automatically if it fails
name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Rollback test: deploy production with a wrong DB password so the health check fails"
        type: boolean
        default: false

      simulate_e2e_failure:
        description: "Demo: make the staging browser tests fail so production is skipped"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/aditya-exe-99/taskflow

jobs:
  # kept the name "check" because branch protection requires it
  check:
    runs-on: [self-hosted, ci-build]
    steps:
      - uses: actions/checkout@v5

      # the test image builds on top of the normal app image
      - name: Build test base image
        run: docker build -t taskflow-test-runtime:local .

      - name: Run unit and integration tests (80% coverage gate)
        env:
          TASKFLOW_TEST_REPORTS: ./test-results/latest
        run: |
          mkdir -p test-results/latest
          chmod 777 test-results/latest
          docker compose -p ci-${{ github.run_id }} -f docker-compose.test.yml up --build --exit-code-from tests

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports-${{ github.run_number }}
          path: test-results/latest/

      # containers write reports as a different user, so clean them up with docker
      - name: Clean up
        if: always()
        run: |
          docker compose -p ci-${{ github.run_id }} -f docker-compose.test.yml down -v
          docker run --rm -v "$PWD/test-results:/r" busybox rm -rf /r/latest

  build:
    needs: check
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, ci-build]
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        run: docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:main .

      - name: Push image
        run: |
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:main

      - name: Summary
        run: echo "Pushed \`$IMAGE:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Tidy old images
        if: always()
        run: docker image prune -f

  deploy-staging:
    needs: build
    # switched on once the staging VM is ready (repository variable STAGING_READY = true)
    if: vars.STAGING_READY == 'true'
    runs-on: [self-hosted, ci-build]
    steps:
      - uses: actions/checkout@v5

      - name: Deploy to staging (health check, roll back on failure)
        env:
          DB_PW: ${{ secrets.STAGING_DB_PASSWORD }}
          APP_SECRET: ${{ secrets.SECRET_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          echo "${{ secrets.STAGING_SSH_KEY }}" > "$RUNNER_TEMP/deploy_key"
          chmod 600 "$RUNNER_TEMP/deploy_key"
          bash deploy/remote-deploy.sh "${{ secrets.STAGING_HOST }}" "$RUNNER_TEMP/deploy_key" "${{ github.sha }}"

      - name: Unit and integration tests on staging (80% coverage gate)
        run: bash deploy/run-staging-unit-integration.sh "${{ secrets.STAGING_HOST }}" "$RUNNER_TEMP/deploy_key" "${{ github.sha }}"

      - name: Upload staging unit, integration and coverage reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: staging-test-reports-${{ github.run_number }}
          path: test-results/staging-unit-integration/
          if-no-files-found: warn

      # Playwright browser tests run on the staging VM against the release just deployed.
      # Any failure fails this job, so deploy-prod is skipped.
      - name: Browser (E2E) tests on staging
        env:
          E2E_SIMULATE_FAILURE: ${{ inputs.simulate_e2e_failure && 'true' || 'false' }}
        run: bash deploy/run-staging-e2e.sh "${{ secrets.STAGING_HOST }}" "$RUNNER_TEMP/deploy_key" "${{ github.sha }}"

      - name: Upload browser test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-results-${{ github.run_number }}
          path: test-results/e2e/
          if-no-files-found: ignore

      - name: Summary
        run: echo "Deployed \`$IMAGE:${{ github.sha }}\` to staging" >> $GITHUB_STEP_SUMMARY

      - name: Clean up
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy_key"

  deploy-prod:
    needs: [build, deploy-staging]
    # runs after staging passes, or straight after build while staging is switched off
    if: always() && needs.build.result == 'success' && (needs.deploy-staging.result == 'success' || needs.deploy-staging.result == 'skipped')
    runs-on: [self-hosted, ci-build]
    steps:
      - uses: actions/checkout@v5

      - name: Deploy to production (health check, roll back on failure)
        env:
          # the rollback test sends a wrong password so the new release fails its health check
          DB_PW: ${{ inputs.simulate_failure && 'wrong-password-rollback-test' || secrets.PROD_DB_PASSWORD }}
          APP_SECRET: ${{ secrets.SECRET_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          echo "${{ secrets.PROD_SSH_KEY }}" > "$RUNNER_TEMP/deploy_key"
          chmod 600 "$RUNNER_TEMP/deploy_key"
          bash deploy/remote-deploy.sh "${{ secrets.PROD_HOST }}" "$RUNNER_TEMP/deploy_key" "${{ github.sha }}"

      - name: Check the live site through Nginx
        run: curl -fsS "http://${{ secrets.PROD_HOST }}/health"

      - name: Summary
        run: echo "Deployed \`$IMAGE:${{ github.sha }}\` to production" >> $GITHUB_STEP_SUMMARY

      - name: Clean up
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy_key"
