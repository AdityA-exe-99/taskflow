{% extends "base.html" %}

{% block title %}Delete task{% endblock %}

{% block content %}
    <div class="page-heading">
        <p>
            <a href="{{ url_for('ui.project_detail', project_id=project.id) }}">
                {{ project.name }}
            </a>
        </p>
        <h1>Delete task</h1>
    </div>

    <section class="card form-card">
        <h2>{{ task.title }}</h2>
        <p>
            This permanently deletes this task from
            <strong>{{ project.name }}</strong>.
        </p>

        {% if error_message %}
            <div class="notice notice-error" role="alert">
                {{ error_message }}
            </div>
        {% endif %}

        <form method="post"
              action="{{ url_for('ui.delete_task', project_id=project.id, task_id=task.id) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="actions">
                <button type="submit" class="button-danger">
                    Confirm deletion
                </button>
                <a class="button button-secondary"
                   href="{{ url_for('ui.project_detail', project_id=project.id) }}">
                    Cancel
                </a>
            </div>
        </form>
    </section>
{% endblock %}
