# Monitoring stack for the production VM: Prometheus, Node Exporter, Grafana
# Start: cd deploy/monitoring && docker compose up -d
services:
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prom_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [default, app]
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.1
    command: --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    restart: unless-stopped

networks:
  # The TaskFlow app's network, so Prometheus can reach web:8000/metrics
  app:
    name: aerodeploy-taskflow_default
    external: true

volumes:
  prom_data:
  grafana_data:
