name: aerodeploy-taskflow

services:
  web:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    environment:
      DATABASE_URL: "postgresql://taskflow:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/taskflow"
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY in .env}"
      APP_VERSION: "${APP_VERSION:-local}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=8).close()"
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 20s

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data: